[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whereami"
version = "2.0.0"
description = "Check which sites have a public profile for a username or email"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = ["requests>=2.32.3,<3"]

[project.scripts]
whereami = "whereami.cli:main"

[tool.setuptools.packages.find]
include = ["whereami*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
